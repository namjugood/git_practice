[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsim"
version = "0.1.0"
description = "실제 git과 로컬 원격 저장소를 이용해 실무 상황을 훈련하는 Git 커맨드 시뮬레이터"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
gitsim = "gitsim.cli:main"

[tool.setuptools.packages.find]
include = ["gitsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
